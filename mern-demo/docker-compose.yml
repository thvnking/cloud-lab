version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mern-backend
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGODB_URI: mongodb+srv://cloud_user1:cloud_user1@cluster0.udo3k0s.mongodb.net/mongo-server?retryWrites=true&w=majority&appName=Cluster0
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mern-frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped
